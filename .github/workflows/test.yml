name: Test

# Runs the test suite against the topologic-core and ifcopenshell wheels on
# PyPI, on every push and pull request.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt -r web/requirements.txt pytest

      - name: Run tests
        run: pytest tests/
